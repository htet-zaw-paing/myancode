<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Ticket - MyanCode</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Jost', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: { myancode: { accent: '#2997ff' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; -webkit-font-smoothing: antialiased; }
        .bg-grid-dark { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
        .glass-panel { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); }
        .btn-hover-effect { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-hover-effect:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -10px rgba(41,151,255,0.2); }
    </style>
</head>
<body class="relative min-h-screen flex flex-col font-sans selection:bg-myancode-accent selection:text-white">

    <div class="absolute inset-0 bg-grid-dark pointer-events-none z-0 opacity-60"></div>

    <header class="relative z-10 p-6 sm:p-8 flex justify-center">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 bg-white/5 border border-white/10 flex items-center justify-center overflow-hidden group-hover:border-myancode-accent transition-colors">
                <img src="../imgs/web-banners/favicon.png" alt="MyanCode" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>
            <span class="font-display font-bold text-2xl tracking-tight text-white">MyanCode</span>
        </a>
    </header>

    <main class="relative z-10 flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-lg">
            
            <div id="searchSection" class="glass-panel p-8 sm:p-12 transition-all duration-500">
                <div class="text-center mb-8">
                    <div class="mx-auto w-16 h-16 bg-white/5 border border-white/10 flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-display font-bold mb-2">Track Your Ticket</h1>
                    <p class="text-sm text-gray-400">Enter your email and 6-character Ticket ID to securely view your status.</p>
                </div>

                <form id="trackForm" onsubmit="handleTrack(event)" class="space-y-5">
                    <div>
                        <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-2">Email Address</label>
                        <input type="email" id="trackEmail" required class="w-full px-5 py-4 bg-[#050505] border border-white/10 text-sm text-white focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="client@example.com">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-2">Ticket ID</label>
                        <input type="text" id="trackId" required maxlength="6" class="w-full px-5 py-4 bg-[#050505] border border-white/10 text-sm font-bold font-mono text-myancode-accent tracking-[0.2em] uppercase focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="W95RJH">
                    </div>
                    
                    <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/20 p-4 flex gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p id="errorMsg" class="text-red-400 text-xs font-medium leading-relaxed"></p>
                    </div>

                    <button type="submit" id="btnTrack" class="w-full mt-4 py-4 text-xs font-bold uppercase tracking-widest bg-myancode-accent text-white hover:bg-blue-600 transition-colors btn-hover-effect flex justify-center items-center gap-2">
                        <span>Check Status</span>
                    </button>
                </form>
            </div>

            <div id="resultSection" class="glass-panel p-8 sm:p-10 hidden opacity-0 transform translate-y-4 transition-all duration-500">
                <div class="flex justify-between items-start mb-8 pb-6 border-b border-white/10">
                    <div>
                        <p class="text-[10px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-1">Official Ticket</p>
                        <h2 id="resId" class="text-2xl font-display font-bold text-myancode-accent tracking-widest"></h2>
                    </div>
                    <div id="resBadge"></div>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-1">Client Name</p>
                            <p id="resName" class="text-sm font-bold text-white"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-1">Request Type</p>
                            <p id="resType" class="text-sm font-medium text-gray-300"></p>
                        </div>
                    </div>
                    
                    <div>
                        <p class="text-[10px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-1">Requested Meeting Time</p>
                        <p id="resTime" class="text-sm font-bold text-white bg-white/5 inline-block px-3 py-1.5 border border-white/10"></p>
                    </div>

                    <div id="resRemarksContainer" class="hidden mt-6 bg-[#0a0a0a] border-l-4 border-myancode-accent p-5">
                        <div class="flex items-center gap-2 mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-myancode-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span class="text-xs font-bold font-mono text-myancode-accent uppercase tracking-widest">Moderator Note</span>
                        </div>
                        <p id="resRemarks" class="text-sm text-gray-300 leading-relaxed"></p>
                    </div>
                </div>

                <button onclick="resetTracker()" class="w-full mt-8 py-3 text-xs font-bold uppercase tracking-widest border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                    Check Another Ticket
                </button>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = window.location.origin + '/supabase-proxy';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRucmV0ZHJhcWp3ZGl3eGNjbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mjk1OTgsImV4cCI6MjA5NDUwNTU5OH0.gmXci7KsgPRFvVtRzY2F--qV5TshCPejf580JTJpl20';
        const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleTrack(e) {
            e.preventDefault();
            
            const email = document.getElementById('trackEmail').value.trim();
            const ticketId = document.getElementById('trackId').value.trim().toUpperCase();
            const btn = document.getElementById('btnTrack');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMsg');

            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
            `;

            try {
                const { data, error } = await supabaseInstance
                    .from('contact_appointments')
                    .select('ticket_id, full_name, request_type, appointment_time, status, remarks')
                    .eq('email', email)
                    .eq('ticket_id', ticketId)
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') {
                        throw new Error("We couldn't find a ticket matching this Email and Ticket ID. Please check for typos and try again.");
                    } else {
                        throw new Error("We are currently experiencing database connection issues. Please try again in a moment.");
                    }
                }
                
                if (!data) {
                    throw new Error("Ticket not found. Please double-check your credentials.");
                }

                showResult(data);

            } catch (err) {
                let friendlyMsg = err.message;
                if (err.message === 'Failed to fetch') {
                    friendlyMsg = "Network error. Please check your internet connection and try again.";
                }
                
                errorMsg.innerText = friendlyMsg;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Check Status</span>`;
            }
        }

        function showResult(data) {
            document.getElementById('resId').innerText = data.ticket_id;
            document.getElementById('resName').innerText = data.full_name;
            document.getElementById('resType').innerText = data.request_type || 'Appointment';
            
            const dateObj = new Date(data.appointment_time);
            document.getElementById('resTime').innerText = dateObj.toLocaleDateString('en-US', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'}) + ' at ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let badgeHtml = '';
            if(data.status === 'pending') badgeHtml = '<span class="px-4 py-1.5 text-xs font-bold uppercase tracking-widest bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">Pending</span>';
            else if(data.status === 'confirmed') badgeHtml = '<span class="px-4 py-1.5 text-xs font-bold uppercase tracking-widest bg-blue-500/10 text-blue-400 border border-blue-500/20">Confirmed</span>';
            else if(data.status === 'completed') badgeHtml = '<span class="px-4 py-1.5 text-xs font-bold uppercase tracking-widest bg-green-500/10 text-green-400 border border-green-500/20">Completed</span>';
            else if(data.status === 'cancelled') badgeHtml = '<span class="px-4 py-1.5 text-xs font-bold uppercase tracking-widest bg-red-500/10 text-red-400 border border-red-500/20">Cancelled</span>';
            document.getElementById('resBadge').innerHTML = badgeHtml;

            const remarksContainer = document.getElementById('resRemarksContainer');
            if (data.remarks && data.remarks.trim() !== '') {
                document.getElementById('resRemarks').innerText = data.remarks;
                remarksContainer.classList.remove('hidden');
            } else {
                remarksContainer.classList.add('hidden');
            }

            document.getElementById('searchSection').classList.add('hidden');
            const resSection = document.getElementById('resultSection');
            resSection.classList.remove('hidden');
            
            setTimeout(() => {
                resSection.classList.remove('opacity-0', 'translate-y-4');
            }, 50);
        }

        function resetTracker() {
            document.getElementById('trackForm').reset();
            const resSection = document.getElementById('resultSection');
            
            resSection.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                resSection.classList.add('hidden');
                document.getElementById('searchSection').classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
