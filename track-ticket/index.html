<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Ticket - MyanCode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../imgs/web-banners/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Jost', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        barcode: ['"Libre Barcode 39"', 'cursive'],
                    },
                    colors: { myancode: { accent: '#2997ff' } }
                }
            }
        }
    </script>
    <style>
        html, body { background-color: #050505; color: #ffffff; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .bg-grid-dark { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
        .glass-panel { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .cutout-left { position: absolute; left: -1px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background-color: #050505; border-radius: 0 100px 100px 0; border: 1px solid rgba(255, 255, 255, 0.05); border-left-color: #050505; }
        .cutout-right { position: absolute; right: -1px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background-color: #050505; border-radius: 100px 0 0 100px; border: 1px solid rgba(255, 255, 255, 0.05); border-right-color: #050505; }
        @media print {
            body * { visibility: hidden; }
            #ticketPrintableArea, #ticketPrintableArea * { visibility: visible; }
            #ticketPrintableArea { position: absolute; left: 0; top: 0; width: 100%; max-width: none !important; border: none; transform: scale(1) !important; background: transparent; }
            .cutout-left, .cutout-right { background-color: white !important; border-color: transparent !important; }
        }
    </style>
</head>
<body class="font-sans min-h-screen relative flex flex-col selection:bg-myancode-accent selection:text-white">
    <div class="fixed inset-0 bg-grid-dark pointer-events-none z-0 opacity-40"></div>
    <div class="fixed top-0 inset-x-0 h-96 bg-myancode-accent/5 blur-[100px] pointer-events-none z-0"></div>

    <div id="toast" class="fixed top-8 right-8 z-[9999] transform transition-all duration-300 translate-y-[-150%] opacity-0 bg-[#111] border border-white/10 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3">
        <i data-lucide="check-circle-2" class="text-green-400 w-5 h-5"></i>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <div id="error-toast" class="fixed top-8 right-8 z-[9999] transform transition-all duration-300 translate-y-[-150%] opacity-0 bg-[#111] border border-red-500/20 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3">
        <i data-lucide="alert-circle" class="text-red-400 w-5 h-5"></i>
        <span id="error-toast-msg" class="text-sm font-medium"></span>
    </div>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4 sm:p-8">
        <div class="mb-10 text-center w-full max-w-md" id="headerSection">
            <a href="../" class="inline-block mb-6"><img src="../imgs/web-banners/favicon.png" class="h-14 w-14 mx-auto drop-shadow-[0_0_15px_rgba(41,151,255,0.3)]"></a>
            <h1 class="text-3xl sm:text-4xl font-display font-bold tracking-tight text-white mb-2">Track Your Ticket</h1>
            <p class="text-sm text-gray-400 font-medium">Enter your credentials below to securely view your consultation status.</p>
        </div>

        <div id="searchFormContainer" class="w-full max-w-md glass-panel p-8 sm:p-10 rounded-[2rem] shadow-2xl transition-all duration-500">
            <form id="trackForm" class="space-y-6">
                <div>
                    <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-3">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="email" id="emailInput" required class="w-full pl-11 pr-4 py-4 bg-[#0a0a0a] border border-white/10 rounded-xl text-sm font-medium text-white focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="client@example.com">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-3">6-Character Ticket ID</label>
                    <div class="relative">
                        <i data-lucide="ticket" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="text" id="ticketIdInput" required maxlength="6" class="w-full pl-11 pr-4 py-4 bg-[#0a0a0a] border border-white/10 rounded-xl text-sm font-bold tracking-widest text-white uppercase focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="XXXXXX">
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-myancode-accent text-white py-4 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-blue-600 transition-all shadow-[0_0_20px_rgba(41,151,255,0.3)] flex items-center justify-center gap-2">
                    <span>Retrieve Ticket</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <div id="ticketResultContainer" class="hidden w-full max-w-[600px] mx-auto animate-[fadeIn_0.4s_ease-out]">
            <div id="ticketPrintableArea" class="w-full drop-shadow-2xl">
                <div class="bg-[#0b1221] rounded-t-3xl p-6 sm:p-8 relative overflow-hidden border border-white/5 border-b-0">
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-[#1a2942] rounded-[0.9rem] flex items-center justify-center border border-blue-500/20 shadow-inner">
                                <i data-lucide="clock" class="text-[#2997ff] w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-gray-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-0.5">MyanCode</div>
                                <div class="text-white text-xl sm:text-2xl font-bold tracking-wide font-display">MEETING TICKET</div>
                            </div>
                        </div>
                        <div id="tkStatus" class="px-3 py-1.5 rounded-md border border-yellow-600/40 bg-yellow-900/20 text-yellow-500 text-[10px] font-bold tracking-widest uppercase">
                            PENDING
                        </div>
                    </div>
                </div>

                <div class="relative h-10 bg-[#111111] flex items-center border-l border-r border-white/5">
                    <div class="cutout-left"></div>
                    <div class="w-full border-t-2 border-dashed border-white/10 mx-6"></div>
                    <div class="cutout-right"></div>
                </div>

                <div class="bg-[#111111] rounded-b-3xl p-6 sm:p-8 pt-2 border border-white/5 border-t-0">
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div>
                            <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Attendee</div>
                            <div class="text-white text-base sm:text-lg font-medium tracking-wide truncate" id="tkName">...</div>
                        </div>
                        <div>
                            <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Request Type</div>
                            <div class="text-white text-base sm:text-lg font-medium tracking-wide truncate" id="tkType">...</div>
                        </div>
                    </div>
                    
                    <div class="border-t border-white/5 my-6"></div>
                    
                    <div class="mb-8">
                        <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Date & Time (MMT)</div>
                        <div class="text-[#2997ff] text-lg sm:text-xl font-bold tracking-wide" id="tkTime">...</div>
                    </div>
                    
                    <div class="flex justify-between items-end gap-4">
                        <div class="pb-1">
                            <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-2">Ticket ID</div>
                            <div class="text-gray-300 font-mono text-sm tracking-[0.15em]" id="tkIdFull">MCT-XXXXXX</div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="font-barcode text-5xl text-white leading-none h-11 overflow-hidden" id="tkBarcode">*XXXXXX*</div>
                            <div class="text-white font-mono text-[9px] tracking-[0.4em] mt-2 mr-[-0.4em]" id="tkBarcodeText">X X X X X X</div>
                        </div>
                    </div>

                    <div id="tkRemarksContainer" class="hidden mt-8 pt-6 border-t border-white/5">
                        <div class="text-[#2997ff] text-[10px] font-bold tracking-widest uppercase mb-2 flex items-center gap-2"><i data-lucide="message-square" class="w-3.5 h-3.5"></i> Moderator Note</div>
                        <div class="text-gray-300 text-sm whitespace-pre-wrap font-medium leading-relaxed" id="tkRemarks"></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8 px-4" id="actionButtons">
                <button onclick="downloadTrackerPDF()" id="btnDownload" class="w-full sm:w-auto px-8 py-3.5 bg-white text-black rounded-xl text-[10px] font-bold tracking-widest uppercase flex justify-center items-center gap-2 transition-all hover:bg-gray-200 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                    <i data-lucide="file-down" class="w-4 h-4"></i> Download PDF
                </button>
                <button onclick="resetTracker()" class="w-full sm:w-auto px-8 py-3.5 bg-transparent border border-white/10 text-gray-300 rounded-xl text-[10px] font-bold tracking-widest uppercase transition-all hover:bg-white/5 hover:text-white flex justify-center items-center gap-2">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> New Search
                </button>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = window.location.origin + '/supabase-proxy';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRucmV0ZHJhcWp3ZGl3eGNjbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mjk1OTgsImV4cCI6MjA5NDUwNTU5OH0.gmXci7KsgPRFvVtRzY2F--qV5TshCPejf580JTJpl20';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(msg, isError = false) {
            const elId = isError ? 'error-toast' : 'toast';
            const msgId = isError ? 'error-toast-msg' : 'toast-msg';
            const toast = document.getElementById(elId);
            document.getElementById(msgId).textContent = msg;
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-[-150%]', 'opacity-0'), 4000);
        }

        document.getElementById('trackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const ticketId = document.getElementById('ticketIdInput').value.trim().toUpperCase();
            const btn = document.getElementById('btnSubmit');

            if (ticketId.length !== 6) {
                showToast("Ticket ID must be exactly 6 characters.", true);
                return;
            }

            const originalBtn = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                const { data, error } = await supabase.rpc('get_ticket_status', { p_email: email, p_ticket_id: ticketId });

                if (error) throw error;
                if (!data || data.length === 0) throw new Error("Ticket not found or email doesn't match.");

                renderFoundTicket(data[0], ticketId);
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.innerHTML = originalBtn;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        function renderFoundTicket(ticketData, ticketId) {
            document.getElementById('headerSection').classList.add('hidden');
            document.getElementById('searchFormContainer').classList.add('hidden');
            document.getElementById('ticketResultContainer').classList.remove('hidden');

            let status = (ticketData.status || 'pending').toUpperCase();
            let statusClasses = 'border-yellow-600/40 bg-yellow-900/20 text-yellow-500';
            if (status === 'CONFIRMED') statusClasses = 'border-blue-500/40 bg-blue-900/20 text-blue-400';
            else if (status === 'COMPLETED') statusClasses = 'border-green-500/40 bg-green-900/20 text-green-400';
            else if (status === 'CANCELLED') statusClasses = 'border-red-500/40 bg-red-900/20 text-red-400';
            
            const statusEl = document.getElementById('tkStatus');
            statusEl.className = `px-3 py-1.5 rounded-md border text-[10px] font-bold tracking-widest uppercase ${statusClasses}`;
            statusEl.innerText = status;

            document.getElementById('tkName').innerText = ticketData.full_name || '-';
            document.getElementById('tkType').innerText = ticketData.request_type || 'Appointment';

            if (ticketData.appointment_time) {
                const reqDate = new Date(ticketData.appointment_time);
                const formatter = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
                document.getElementById('tkTime').innerText = formatter.format(reqDate);
            } else {
                document.getElementById('tkTime').innerText = 'TBD';
            }

            document.getElementById('tkIdFull').innerText = 'MCT-' + ticketId;
            document.getElementById('tkBarcode').innerText = '*' + ticketId + '*';
            document.getElementById('tkBarcodeText').innerText = ticketId.split('').join(' ');

            const remarksContainer = document.getElementById('tkRemarksContainer');
            if (ticketData.remarks && ticketData.remarks.trim() !== '') {
                document.getElementById('tkRemarks').innerText = ticketData.remarks;
                remarksContainer.classList.remove('hidden');
            } else {
                remarksContainer.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function resetTracker() {
            document.getElementById('emailInput').value = '';
            document.getElementById('ticketIdInput').value = '';
            document.getElementById('ticketResultContainer').classList.add('hidden');
            document.getElementById('headerSection').classList.remove('hidden');
            document.getElementById('searchFormContainer').classList.remove('hidden');
        }

        function downloadTrackerPDF() {
            const element = document.getElementById('ticketPrintableArea');
            const ticketIdText = document.getElementById('tkIdFull').innerText.replace('MCT-', '');
            const opt = {
                margin:       0.2,
                filename:     `MyanCode_Ticket_${ticketIdText}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 3, useCORS: true, backgroundColor: '#050505' },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            const btn = document.getElementById('btnDownload');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Generating...`;
            btn.disabled = true;
            lucide.createIcons();

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
                showToast("Ticket downloaded successfully!");
            }).catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
                showToast("Failed to generate PDF.", true);
            });
        }
    </script>
</body>
</html>
