<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Ticket - MyanCode</title>
    <link rel="icon" href="../google-favicon.png" sizes="32x32"/>
    <link rel="icon" href="../favicon.ico"/>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../google-favicon.png"/>
   <link rel="icon" type="image/png" sizes="512x512" href="../google-favicon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Libre+Barcode+39&display=swap" rel="stylesheet">
    <script src="../tailwind.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Jost', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        barcode: ['"Libre Barcode 39"', 'cursive'],
                    },
                    colors: { myancode: { accent: '#2997ff' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; -webkit-font-smoothing: antialiased; }
        .bg-grid-dark { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
        .glass-panel { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); }
        .btn-hover-effect { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-hover-effect:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px -10px rgba(41,151,255,0.2); }
        .cutout-left { position: absolute; left: -1px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background-color: #050505; border-radius: 0 100px 100px 0; border: 1px solid rgba(255, 255, 255, 0.05); border-left-color: #050505; }
        .cutout-right { position: absolute; right: -1px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background-color: #050505; border-radius: 100px 0 0 100px; border: 1px solid rgba(255, 255, 255, 0.05); border-right-color: #050505; }
        @media print {
            body * { visibility: hidden; }
            #ticketPrintableArea, #ticketPrintableArea * { visibility: visible; }
            #ticketPrintableArea { position: absolute; left: 0; top: 0; width: 100%; max-width: none !important; border: none; transform: scale(1) !important; background: transparent; }
            .cutout-left, .cutout-right { background-color: white !important; border-color: transparent !important; }
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col font-sans selection:bg-myancode-accent selection:text-white">

    <div class="absolute inset-0 bg-grid-dark pointer-events-none z-0 opacity-60"></div>

    <header class="relative z-10 p-6 sm:p-8 flex justify-center">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 bg-white/5 border border-white/10 flex items-center justify-center overflow-hidden group-hover:border-myancode-accent transition-colors">
                <img src="../imgs/web-banners/favicon.png" alt="MyanCode" class="w-full h-full object-cover" onerror="this.style.display='none';">
            </div>
            <span class="font-display font-bold text-2xl tracking-tight text-white">MyanCode</span>
        </a>
    </header>

    <main class="relative z-10 flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-lg">

            <a href="../" class="inline-flex items-center gap-3 text-gray-400 hover:text-white transition-colors mb-6 text-[11px] font-bold font-mono uppercase tracking-widest group">
                <div class="w-8 h-8 bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-myancode-accent group-hover:bg-myancode-accent/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:-translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </div>
                Back to Home
            </a>
            
            <div id="searchSection" class="glass-panel p-8 sm:p-12 transition-all duration-500">
                <div class="text-center mb-8">
                    <div class="mx-auto w-16 h-16 bg-white/5 border border-white/10 flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-display font-bold mb-2">Track Your Ticket</h1>
                    <p class="text-sm text-gray-400">Enter your email and 6-character Ticket ID to securely view your status.</p>
                </div>

                <form id="trackForm" onsubmit="handleTrack(event)" class="space-y-5">
                    <div>
                        <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-2">Email Address</label>
                        <input type="email" id="trackEmail" required class="w-full px-5 py-4 bg-[#050505] border border-white/10 text-sm text-white focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="client@example.com">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold font-mono text-gray-500 uppercase tracking-widest mb-2">Ticket ID</label>
                        <input type="text" id="trackId" required maxlength="6" class="w-full px-5 py-4 bg-[#050505] border border-white/10 text-sm font-bold font-mono text-myancode-accent tracking-[0.2em] uppercase focus:outline-none focus:border-myancode-accent transition-all shadow-inner" placeholder="W95RJH">
                    </div>
                    
                    <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/20 p-4 flex gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p id="errorMsg" class="text-red-400 text-xs font-medium leading-relaxed"></p>
                    </div>

                    <button type="submit" id="btnTrack" class="w-full mt-4 py-4 text-xs font-bold uppercase tracking-widest bg-myancode-accent text-white hover:bg-blue-600 transition-colors btn-hover-effect flex justify-center items-center gap-2">
                        <span>Check Status</span>
                    </button>
                </form>
            </div>

            <div id="ticketResultContainer" class="hidden w-full max-w-[600px] mx-auto opacity-0 transform translate-y-4 transition-all duration-500">
                <div id="ticketPrintableArea" class="w-full drop-shadow-2xl">
                    <div class="bg-[#0b1221] rounded-t-3xl p-6 sm:p-8 relative overflow-hidden border border-white/5 border-b-0">
                        <div class="flex justify-between items-center relative z-10">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-[#1a2942] rounded-[0.9rem] flex items-center justify-center border border-blue-500/20 shadow-inner">
                                    <i data-lucide="clock" class="text-[#2997ff] w-6 h-6"></i>
                                </div>
                                <div>
                                    <div class="text-gray-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-0.5">MyanCode</div>
                                    <div class="text-white text-xl sm:text-2xl font-bold tracking-wide font-display">MEETING TICKET</div>
                                </div>
                            </div>
                            <div id="tkStatus" class="px-3 py-1.5 rounded-md border border-yellow-600/40 bg-yellow-900/20 text-yellow-500 text-[10px] font-bold tracking-widest uppercase">
                            </div>
                        </div>
                    </div>

                    <div class="relative h-10 bg-[#111111] flex items-center border-l border-r border-white/5">
                        <div class="cutout-left"></div>
                        <div class="w-full border-t-2 border-dashed border-white/10 mx-6"></div>
                        <div class="cutout-right"></div>
                    </div>

                    <div class="bg-[#111111] rounded-b-3xl p-6 sm:p-8 pt-2 border border-white/5 border-t-0">
                        <div class="grid grid-cols-2 gap-6 mb-6">
                            <div>
                                <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Attendee</div>
                                <div class="text-white text-base sm:text-lg font-medium tracking-wide truncate" id="tkName"></div>
                            </div>
                            <div>
                                <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Request Type</div>
                                <div class="text-white text-base sm:text-lg font-medium tracking-wide truncate" id="tkType"></div>
                            </div>
                        </div>
                        
                        <div class="border-t border-white/5 my-6"></div>
                        
                        <div class="mb-8">
                            <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-1.5">Date & Time (MMT)</div>
                            <div class="text-[#2997ff] text-lg sm:text-xl font-bold tracking-wide" id="tkTime"></div>
                        </div>
                        
                        <div class="flex justify-between items-end gap-4">
                            <div class="pb-1">
                                <div class="text-gray-500 text-[9px] font-bold tracking-[0.15em] uppercase mb-2">Ticket ID</div>
                                <div class="text-gray-300 font-mono text-sm tracking-[0.15em]" id="tkIdFull"></div>
                            </div>
                            <div class="text-right flex flex-col items-end">
                                <div class="font-barcode text-5xl text-white leading-none h-11 overflow-hidden" id="tkBarcode"></div>
                                <div class="text-white font-mono text-[9px] tracking-[0.4em] mt-2 mr-[-0.4em]" id="tkBarcodeText"></div>
                            </div>
                        </div>

                        <div id="tkRemarksContainer" class="hidden mt-8 pt-6 border-t border-white/5">
                            <div class="text-[#2997ff] text-[10px] font-bold tracking-widest uppercase mb-2 flex items-center gap-2"><i data-lucide="message-square" class="w-3.5 h-3.5"></i> Moderator Note</div>
                            <div class="text-gray-300 text-sm whitespace-pre-wrap font-medium leading-relaxed" id="tkRemarks"></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8 px-4" id="actionButtons">
                    <button onclick="downloadTrackerPDF()" id="btnDownload" class="w-full sm:w-auto px-8 py-3.5 bg-white text-black rounded-xl text-[10px] font-bold tracking-widest uppercase flex justify-center items-center gap-2 transition-all hover:bg-gray-200 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                        <i data-lucide="file-down" class="w-4 h-4"></i> Download PDF
                    </button>
                    <button onclick="resetTracker()" class="w-full sm:w-auto px-8 py-3.5 bg-transparent border border-white/10 text-gray-300 rounded-xl text-[10px] font-bold tracking-widest uppercase transition-all hover:bg-white/5 hover:text-white flex justify-center items-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> New Search
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = window.location.origin + '/supabase-proxy';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRucmV0ZHJhcWp3ZGl3eGNjbXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mjk1OTgsImV4cCI6MjA5NDUwNTU5OH0.gmXci7KsgPRFvVtRzY2F--qV5TshCPejf580JTJpl20';
        const supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleTrack(e) {
            e.preventDefault();
            
            const email = document.getElementById('trackEmail').value.trim();
            const ticketId = document.getElementById('trackId').value.trim().toUpperCase();
            const btn = document.getElementById('btnTrack');
            const errorBox = document.getElementById('errorBox');
            const errorMsg = document.getElementById('errorMsg');

            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
            `;

            try {
                const { data, error } = await supabaseInstance
                    .rpc('get_ticket_status', { 
                        search_email: email, 
                        search_ticket_id: ticketId 
                    })
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') {
                        throw new Error("We couldn't find a ticket matching this Email and Ticket ID. Please check for typos and try again.");
                    } else {
                        throw new Error("We are currently experiencing database connection issues. Please try again in a moment.");
                    }
                }
                
                if (!data) {
                    throw new Error("Ticket not found. Please double-check your credentials.");
                }

                showResult(data);

            } catch (err) {
                let friendlyMsg = err.message;
                if (err.message === 'Failed to fetch') {
                    friendlyMsg = "Network error. Please check your internet connection and try again.";
                }
                
                errorMsg.innerText = friendlyMsg;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Check Status</span>`;
            }
        }

        function showResult(data) {
            let status = (data.status || 'pending').toUpperCase();
            let statusClasses = 'border-yellow-600/40 bg-yellow-900/20 text-yellow-500';
            if (status === 'CONFIRMED') statusClasses = 'border-blue-500/40 bg-blue-900/20 text-blue-400';
            else if (status === 'COMPLETED') statusClasses = 'border-green-500/40 bg-green-900/20 text-green-400';
            else if (status === 'CANCELLED') statusClasses = 'border-red-500/40 bg-red-900/20 text-red-400';
            
            const statusEl = document.getElementById('tkStatus');
            statusEl.className = `px-3 py-1.5 rounded-md border text-[10px] font-bold tracking-widest uppercase ${statusClasses}`;
            statusEl.innerText = status;

            document.getElementById('tkName').innerText = data.full_name || '-';
            document.getElementById('tkType').innerText = data.request_type || 'Appointment';

            if (data.appointment_time) {
                const reqDate = new Date(data.appointment_time);
                const formatter = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
                document.getElementById('tkTime').innerText = formatter.format(reqDate);
            } else {
                document.getElementById('tkTime').innerText = 'TBD';
            }

            const tid = data.ticket_id.toUpperCase();
            document.getElementById('tkIdFull').innerText = 'MCT-' + tid;
            document.getElementById('tkBarcode').innerText = '*' + tid + '*';
            document.getElementById('tkBarcodeText').innerText = tid.split('').join(' ');

            const remarksContainer = document.getElementById('tkRemarksContainer');
            if (data.remarks && data.remarks.trim() !== '') {
                document.getElementById('tkRemarks').innerText = data.remarks;
                remarksContainer.classList.remove('hidden');
            } else {
                remarksContainer.classList.add('hidden');
            }

            document.getElementById('searchSection').classList.add('hidden');
            const resSection = document.getElementById('ticketResultContainer');
            resSection.classList.remove('hidden');
            
            setTimeout(() => {
                resSection.classList.remove('opacity-0', 'translate-y-4');
            }, 50);

            lucide.createIcons();
        }

        function resetTracker() {
            document.getElementById('trackForm').reset();
            const resSection = document.getElementById('ticketResultContainer');
            
            resSection.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                resSection.classList.add('hidden');
                document.getElementById('searchSection').classList.remove('hidden');
            }, 500);
        }

        function downloadTrackerPDF() {
            const element = document.getElementById('ticketPrintableArea');
            const ticketIdText = document.getElementById('tkIdFull').innerText.replace('MCT-', '');
            const opt = {
                margin:       0.2,
                filename:     `MyanCode_Ticket_${ticketIdText}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 3, useCORS: true, backgroundColor: '#050505' },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            const btn = document.getElementById('btnDownload');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Generating...`;
            btn.disabled = true;
            lucide.createIcons();

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
            }).catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
            });
        }
</script>
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3429d3695bcd41d694be7bc7b2afd313"}'></script>
</body>
</html>
