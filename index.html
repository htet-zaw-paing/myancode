<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Notice</title>

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#000;
    color:#fff;
    font-family:'Jost',sans-serif;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    max-width:560px;
    padding:32px;
    text-align:center;
}

.brand{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:1.6px;
    opacity:.4;
    margin-bottom:24px;
}

h1{
    font-size:30px;
    font-weight:500;
    margin-bottom:14px;
}

p{
    font-size:14px;
    font-weight:300;
    line-height:1.85;
    opacity:.6;
    margin-bottom:20px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:20px 0 8px;
    font-family:'JetBrains Mono',monospace;
    font-size:18px;
}

.unit{
    display:flex;
    gap:5px;
    align-items:baseline;
}

.num{
    display:inline-block;
    min-width:22px;
    text-align:right;
    transition:transform .25s ease, opacity .25s ease;
}

.num.change{
    transform:translateY(-4px);
    opacity:.4;
}

.label{
    font-size:12px;
    opacity:.5;
}

.countdown-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    opacity:.35;
}

.status{
    margin-top:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:1.6px;
    opacity:.5;
    animation:pulse 2.5s ease-in-out infinite;
}

.meta{
    margin-top:22px;
    font-size:12.5px;
    line-height:2;
    opacity:.45;
}

a{
    color:#fff;
    text-decoration:none;
    opacity:.8;
}

a:hover{opacity:1}

.toggle{
    margin-top:24px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1.4px;
    opacity:.35;
    cursor:pointer;
}

.dot{
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    margin:20px auto 0;
    opacity:.15;
}

@keyframes pulse{
    0%,100%{opacity:.35}
    50%{opacity:.7}
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">&lt;/&gt; MyanCode</div>

    <h1 id="title">Service Unavailable</h1>

    <p id="desc">
        The system is currently undergoing maintenance. Access is temporarily suspended.
    </p>

    <p id="apology">
        We apologize for any inconvenience.
    </p>

    <div class="countdown">
        <div class="unit"><span class="num" id="d">--</span><span class="label">d</span></div>
        <div class="unit"><span class="num" id="h">--</span><span class="label">h</span></div>
        <div class="unit"><span class="num" id="m">--</span><span class="label">m</span></div>
        <div class="unit"><span class="num" id="s">--</span><span class="label">s</span></div>
    </div>

    <div class="countdown-label" id="cdlabel">REMAINING TIME</div>

    <div class="status" id="status">
        MAINTENANCE IN PROGRESS
    </div>

    <div class="meta">
        <a href="https://htetzawpaing.site" target="_blank">Htet Zaw Paing</a><br>
        <a href="mailto:contact@htetzawpaing.site">contact@htetzawpaing.site</a><br>
        <a href="tel:+959456751882">+959456751882</a>
    </div>

    <div class="toggle" onclick="toggleLang()">မြန်မာ</div>

    <div class="dot"></div>

</div>

<script>
const target=new Date("May 30, 2026 00:00:00").getTime()

function animate(id,val){
    const el=document.getElementById(id)
    if(el.textContent!==val){
        el.classList.add("change")
        setTimeout(()=>{
            el.textContent=val
            el.classList.remove("change")
        },120)
    }
}

function update(){
    const now=new Date().getTime()
    const diff=target-now

    if(diff<=0){
        ["d","h","m","s"].forEach(i=>document.getElementById(i).textContent="00")
        return
    }

    const d=Math.floor(diff/(1000*60*60*24))
    const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60))
    const m=Math.floor((diff%(1000*60*60))/(1000*60))
    const s=Math.floor((diff%(1000*60))/1000)

    animate("d",String(d).padStart(2,"0"))
    animate("h",String(h).padStart(2,"0"))
    animate("m",String(m).padStart(2,"0"))
    animate("s",String(s).padStart(2,"0"))
}

setInterval(update,1000)
update()

const status=document.getElementById("status")
let dots=0
setInterval(()=>{
    dots=(dots+1)%4
    status.textContent=(mm
        ? "ပြုပြင်ထိန်းသိမ်းနေပါသည်"
        : "MAINTENANCE IN PROGRESS") + ".".repeat(dots)
},500)

let mm=false

function toggleLang(){
    mm=!mm

    document.getElementById("title").textContent = mm
    ? "ဝန်ဆောင်မှု မရရှိနိုင်ပါ"
    : "Service Unavailable"

    document.getElementById("desc").textContent = mm
    ? "စနစ်အား လက်ရှိတွင် ပြုပြင်ထိန်းသိမ်းနေပါသည်။ အသုံးပြုမှုကို ယာယီ ရပ်နားထားပါသည်။"
    : "The system is currently undergoing maintenance. Access is temporarily suspended."

    document.getElementById("apology").textContent = mm
    ? "ဖြစ်ပေါ်ခဲ့သော အဆင်မပြေမှုအတွက် တောင်းပန်အပ်ပါသည်။"
    : "We apologize for any inconvenience."

    document.getElementById("cdlabel").textContent = mm
    ? "ကျန်ရှိသောအချိန်"
    : "REMAINING TIME"
}
</script>

</body>
</html>
